<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MARK OS</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            background: #0b1020;
            color: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at top, rgba(77, 111, 255, 0.18), transparent 35%),
                #0b1020;
        }

        .login-card {
            width: min(100%, 420px);
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            background: rgba(18, 25, 48, 0.92);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        }

        .eyebrow {
            margin: 0 0 8px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #8fa7ff;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
        }

        .subtitle {
            margin: 10px 0 24px;
            color: #aeb8cf;
            line-height: 1.5;
        }

        .alert {
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(255, 93, 93, 0.12);
            border: 1px solid rgba(255, 93, 93, 0.28);
            color: #ffb8b8;
        }

        .notice {
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(255, 190, 77, 0.12);
            border: 1px solid rgba(255, 190, 77, 0.28);
            color: #ffd28a;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: 650;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;
            background: #0e1530;
            color: #f4f7fb;
            font: inherit;
            outline: none;
        }

        input:focus {
            border-color: #7890ff;
            box-shadow: 0 0 0 3px rgba(120, 144, 255, 0.16);
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px 16px;
            border: 0;
            border-radius: 12px;
            background: #7087ff;
            color: white;
            font: inherit;
            font-weight: 750;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.08);
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #7f8aa3;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <p class="eyebrow">Personal Operating System</p>
        <h1>MARK OS</h1>
        <p class="subtitle">Sign in to continue to your quests, direction, and Life OS.</p>

        {% if error %}
        <div class="alert" role="alert">{{ error }}</div>
        {% endif %}

        {% if not configured %}
        <div class="notice" role="status">
            Login is not configured. Set <strong>MARK_OS_PASSWORD</strong> before signing in.
        </div>
        {% endif %}

        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next }}">

            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                type="text"
                value="mark"
                autocomplete="username"
                required
                autofocus
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button type="submit" {% if not configured %}disabled{% endif %}>
                Sign in
            </button>
        </form>

        <p class="footer">MARK OS v0.2.0</p>
    </main>
</body>
</html>
