<!doctype html>
<html lang="en" class="has-background-black-bis">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0f0c">
    <title>{% block title %}MARK OS{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body class="has-background-black-bis has-text-light">
    <nav class="navbar is-black" role="navigation" aria-label="main navigation">
        <div class="container">
            <div class="navbar-brand">
                <a class="navbar-item has-text-success-light" href="/">
                    <span class="tag is-success is-medium mr-3 is-family-monospace">M</span>
                    <span class="has-text-weight-bold is-family-monospace">
                        MARK OS <span class="has-text-grey-light is-size-7">v0.2.1</span>
                    </span>
                </a>
            </div>

            <div class="navbar-menu is-active has-background-black">
                <div class="navbar-start">
                    <a class="navbar-item {% if request.url.path == '/' %}has-background-black-ter has-text-success-light{% else %}has-text-grey-light{% endif %}" href="/">Today</a>
                    <a class="navbar-item {% if request.url.path.startswith('/quests') %}has-background-black-ter has-text-success-light{% else %}has-text-grey-light{% endif %}" href="/quests">Quests</a>
                    <a class="navbar-item {% if request.url.path == '/life-os' %}has-background-black-ter has-text-success-light{% else %}has-text-grey-light{% endif %}" href="/life-os">Life OS</a>
                    <a class="navbar-item {% if request.url.path == '/history' %}has-background-black-ter has-text-success-light{% else %}has-text-grey-light{% endif %}" href="/history">History</a>
                </div>

                <div class="navbar-end">
                    {% if system_state %}
                    <div class="navbar-item">
                        <div class="tags has-addons mb-0">
                            <span class="tag is-success is-dark is-family-monospace">LEVEL {{ system_state.level }}</span>
                            <span class="tag is-success is-light is-family-monospace">{{ system_state.xp_total or 0 }} XP</span>
                        </div>
                    </div>
                    {% endif %}
                    <div class="navbar-item">
                        <form method="post" action="/logout">
                            <button class="button is-dark is-small" type="submit">Log out</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <section class="section pt-5">
        <main class="container">
            {% block content %}{% endblock %}
        </main>
    </section>
</body>
</html>
